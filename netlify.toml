[build]
  command = "pnpm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "pnpm run dev"
  port = 8888
  targetPort = 5173
  framework = "#custom"
  # netlify dev will pick up functions from netlify/functions

[[edge_functions]]
  path = "/*"
  excludedPath = "/.netlify/*"
  function = "auth"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Указываем расписание для checkPositions прямо в конфиге Netlify
[functions."checkPositions"]
  schedule = "* * * * *"